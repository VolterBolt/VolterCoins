name: VolterCoins
version: 1.0.0
main: dev.coins.VolterCoins
api-version: '1.20'
description: A standalone economy plugin for Paper 1.20.4 with independent APIs and Vault bridge
authors:
  - VolterBolt
website: https://github.com/VolterBolt/VolterCoins

softdepend:
  - PlaceholderAPI
  - Vault

commands:
  balance:
    description: Check your balance or another player's balance
    usage: /balance [player]
    aliases:
      - bal
      - money
    permission: voltercoin.balance.check

  pay:
    description: Send money to another player
    usage: /pay <player> <amount>
    aliases:
      - send
      - transfer
    permission: voltercoin.pay.send

  coins:
    description: VolterCoins main command
    usage: /coins <subcommand>
    aliases:
      - coin
    permission: voltercoin.use

  coinsadmin:
    description: Administrator commands for VolterCoins
    usage: /coinsadmin <subcommand> [args]
    aliases:
      - coinadmin
      - cadmin
    permission: voltercoin.admin

  coinstop:
    description: View top 10 richest players
    usage: /coinstop [page]
    aliases:
      - baltop
      - moneytop
    permission: voltercoin.top

  coinhistory:
    description: View transaction history
    usage: /coinhistory [player]
    aliases:
      - history
      - transactions
    permission: voltercoin.history

permissions:
  voltercoin.use:
    description: Base permission for VolterCoins
    default: true

  voltercoin.balance.check:
    description: Check own balance or other players' balance
    default: true
    parent: voltercoin.use

  voltercoin.balance.check.others:
    description: Check other players' balances
    default: true
    parent: voltercoin.balance.check

  voltercoin.pay.send:
    description: Send money to other players
    default: true
    parent: voltercoin.use

  voltercoin.top:
    description: View top richest players
    default: true
    parent: voltercoin.use

  voltercoin.history:
    description: View transaction history
    default: true
    parent: voltercoin.use

  voltercoin.admin:
    description: Access all admin commands
    default: op

  voltercoin.admin.give:
    description: Give money to a player
    default: op
    parent: voltercoin.admin

  voltercoin.admin.take:
    description: Take money from a player
    default: op
    parent: voltercoin.admin

  voltercoin.admin.set:
    description: Set a player's balance
    default: op
    parent: voltercoin.admin

  voltercoin.admin.reset:
    description: Reset a player's balance
    default: op
    parent: voltercoin.admin

  voltercoin.admin.transaction:
    description: View and manage transactions
    default: op
    parent: voltercoin.admin

  voltercoin.admin.reload:
    description: Reload plugin configuration
    default: op
    parent: voltercoin.admin

  voltercoin.admin.export:
    description: Export player data
    default: op
    parent: voltercoin.admin

  voltercoin.bypass.transaction-limit:
    description: Bypass transaction amount limits
    default: false

  voltercoin.bypass.cooldown:
    description: Bypass pay command cooldown
    default: false